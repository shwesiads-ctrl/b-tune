name: Windows VST3 DAW preview
on:
  push:
    branches: [browser-preview]
    paths: ['project/Source/**', 'project/Tests/**', 'project/CMakeLists.txt', 'project/scripts/package-native.py', 'project/docs/DAW-TESTING.md', '.github/workflows/native-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo,branch='daw-preview-windows';
            try { await github.rest.git.getRef({owner,repo,ref:'heads/'+branch}); }
            catch(e) { if(e.status!==404) throw e; await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:context.sha}); }
            let sha;try {sha=(await github.rest.repos.getContent({owner,repo,path:'build-status.json',ref:branch})).data.sha;} catch(e){if(e.status!==404)throw e;}
            const status={state:'building',sourceSha:context.sha,runId:context.runId,runUrl:`https://github.com/${owner}/${repo}/actions/runs/${context.runId}`};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,branch,path:'build-status.json',message:'Start Windows VST3 build '+context.runId,sha,content:Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64')});
            const readme=(await github.rest.repos.getContent({owner,repo,path:'README.md',ref:branch})).data;
            await github.rest.repos.createOrUpdateFileContents({owner,repo,branch,path:'README.md',sha:readme.sha,message:'Windows build in progress '+context.runId,content:Buffer.from(`# Matale Tune Windows x64 VST3\n\nBuild in progress for ${context.sha}.\n\n[Follow this build](${status.runUrl})\n\nAny existing ZIP belongs to an earlier build until build-status.json reports success for this source revision.\n`).toString('base64')});
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned JUCE native build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          cmake -S project -B build-native -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -FilePath out/configure.log
          if ($LASTEXITCODE -ne 0) { throw "Native configure failed" }
      - name: Build Windows x64 VST3 and tests
        shell: pwsh
        run: |
          cmake --build build-native --config Release --parallel 2 2>&1 | Tee-Object -FilePath out/build.log
          if ($LASTEXITCODE -ne 0) { throw "Native build failed" }
      - name: Native core, processor, closed-editor Auto and UI tests
        shell: pwsh
        env:
          MATALE_NATIVE_SCREENSHOT: ${{ github.workspace }}\out\Native-UI.png
        run: |
          ctest --test-dir build-native -C Release --output-on-failure 2>&1 | Tee-Object -FilePath out/tests.log
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }
      - name: Validate VST3 with pluginval 1.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip pluginval -Force
          $validator = Get-ChildItem pluginval -Filter pluginval.exe -Recurse | Select-Object -First 1
          if (!$validator) { throw "pluginval.exe missing" }
          $bundle = (Resolve-Path 'build-native/MataleTune_artefacts/Release/VST3/Matale Tune.vst3').Path
          & $validator.FullName --strictness-level 5 --timeout-ms 60000 --skip-gui-tests --output-dir "$env:GITHUB_WORKSPACE/out/pluginval-logs" $bundle 2>&1 | Tee-Object -FilePath out/pluginval.log
          if ($LASTEXITCODE -ne 0) { throw "VST3 validation failed" }
      - name: Package verified Windows module and corresponding source
        shell: pwsh
        run: python project/scripts/package-native.py --build-dir build-native --output out/MataleTune-Windows-x64-VST3.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-results
          path: out/
          if-no-files-found: error
          retention-days: 30
  publish:
    if: always()
    needs: [build, announce]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: native-windows-results
          path: results
      - uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),{owner,repo}=context.repo,branch='daw-preview-windows';
            try {await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});} catch(e){if(e.status!==404)throw e;await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:context.sha});}
            let previous;try {previous=(await github.rest.repos.getContent({owner,repo,path:'build-status.json',ref:branch})).data;} catch(e){if(e.status!==404)throw e;}
            if(previous?.content){const old=JSON.parse(Buffer.from(previous.content,'base64').toString());if(old.runId>context.runId){core.info('A newer build owns the status');return;}}
            async function put(path,content){let sha;try {sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;} catch(e){if(e.status!==404)throw e;}await github.rest.repos.createOrUpdateFileContents({owner,repo,branch,path,message:'Windows DAW preview '+context.runId,sha,content:content.toString('base64')});}
            const zip='results/MataleTune-Windows-x64-VST3.zip',ok=process.env.BUILD_RESULT==='success'&&fs.existsSync(zip),status={state:ok?'success':process.env.BUILD_RESULT==='success'?'artifact-missing':process.env.BUILD_RESULT,sourceSha:context.sha,runId:context.runId,runUrl:`https://github.com/${owner}/${repo}/actions/runs/${context.runId}`};
            if(ok){const bytes=fs.readFileSync(zip);status.sha256=crypto.createHash('sha256').update(bytes).digest('hex');status.download=`https://github.com/${owner}/${repo}/raw/refs/heads/${branch}/MataleTune-Windows-x64-VST3.zip`;await put('MataleTune-Windows-x64-VST3.zip',bytes);await put('MataleTune-Windows-x64-VST3.zip.sha256',Buffer.from(status.sha256+'  MataleTune-Windows-x64-VST3.zip\n'));for(const name of ['Native-UI.png','Native-Manual-UI.png'])if(fs.existsSync('results/'+name))await put(name,fs.readFileSync('results/'+name));}
            const logs=['configure.log','build.log','tests.log','pluginval.log'].filter(f=>fs.existsSync('results/'+f)).map(f=>'## '+f+'\n\n'+fs.readFileSync('results/'+f,'utf8').split('\n').slice(-120).join('\n')).join('\n\n');
            await put('BUILD-LOG.txt',Buffer.from(logs));await put('README.md',Buffer.from(`# Matale Tune Windows x64 VST3\n\nBuild: **${status.state}**\n\nSource: ${context.sha}\n\n[Build details](${status.runUrl})\n\n${ok?'[Download native VST3 ZIP]('+status.download+')\n\nExtract fully and read READ-ME-FIRST.md before installing. This is an unsigned DAW preview; real DAW testing remains necessary.':'No new binary was published. See BUILD-LOG.txt and build details. Any older ZIP belongs to its earlier source revision.'}\n`));await put('build-status.json',Buffer.from(JSON.stringify(status,null,2)+'\n'));
