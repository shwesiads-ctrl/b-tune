name: Browser validation
on: [push, pull_request, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/Web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: python3 ../Tests/LauncherTests.py
      - run: npm run test:dsp
      - run: npm run test:session
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: MataleTune-Browser
          path: project/Web/dist/
